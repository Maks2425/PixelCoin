{% extends "base_auth.html" %}

{% block title %}Open Account — PixelCoin{% endblock %}

{% block content %}
<h1 class="auth-title">Open Account</h1>
<p class="auth-subtitle">Join the next-generation crypto bank</p>

<form method="post" class="auth-form">
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="Min. 4 characters" minlength="4">
  </div>

  <div class="form-group">
    <label for="confirm_password">Confirm Password</label>
    <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password" placeholder="Repeat password">
  </div>

  <button type="submit" class="btn-gold auth-submit">Create Account</button>
</form>
{% endblock %}

{% block footer_link %}
Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
{% endblock %}
