{% extends "base_auth.html" %}

{% block title %}Sign In — PixelCoin{% endblock %}

{% block content %}
<h1 class="auth-title">Sign In</h1>
<p class="auth-subtitle">Access your PixelCoin account</p>

<form method="post" class="auth-form">
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
  </div>

  <label class="form-check">
    <input type="checkbox" name="remember" value="1">
    Remember me
  </label>

  <button type="submit" class="btn-gold auth-submit">Sign In</button>
</form>
{% endblock %}

{% block footer_link %}
Don't have an account? <a href="{{ url_for('register') }}">Create one</a>
{% endblock %}
